<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін панель - Шавуха у Остапа</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .login-container h1 {
            color: #764ba2;
            margin-bottom: 30px;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 20px;
            background: white;
            border-radius: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 2.5em;
            color: #764ba2;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #667eea;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #667eea;
            border-radius: 25px;
            font-size: 1em;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-group textarea {
            border-radius: 15px;
            min-height: 80px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(118, 75, 162, 0.3);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .panel {
            background: white;
            padding: 30px;
            border-radius: 25px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        .panel h2 {
            color: #764ba2;
            margin-bottom: 20px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .menu-item {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            border-radius: 20px;
            position: relative;
        }

        .menu-item h3 {
            color: #764ba2;
            margin-bottom: 10px;
        }

        .menu-item p {
            color: #555;
            margin-bottom: 10px;
        }

        .price {
            font-size: 1.5em;
            color: #667eea;
            font-weight: bold;
            margin: 10px 0;
        }

        .delete-btn {
            background: #e74c3c;
            padding: 8px 20px;
            margin-top: 10px;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        .logout-btn {
            background: #95a5a6;
            float: right;
        }

        .logout-btn:hover {
            background: #7f8c8d;
        }

        .hidden {
            display: none;
        }

        .success-msg {
            background: #2ecc71;
            color: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .menu-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Форма входу -->
    <div id="loginForm" class="login-container">
        <h1>🔐 Адмін панель</h1>
        <p style="color: #667eea; margin-bottom: 20px;">Введіть пароль для доступу</p>
        <div class="form-group">
            <input type="password" id="passwordInput" placeholder="Пароль" onkeypress="if(event.key==='Enter') checkPassword()">
        </div>
        <button onclick="checkPassword()">Увійти</button>
        <p style="margin-top: 20px; font-size: 0.9em; color: #999;">Пароль за замовчуванням: <strong>admin123</strong></p>
    </div>

    <!-- Адмін панель -->
    <div id="adminPanel" class="admin-container hidden">
        <header>
            <h1>⚙️ Панель управління - Шавуха у Остапа</h1>
            <button class="logout-btn" onclick="logout()">Вийти</button>
        </header>

        <!-- Редагування контактів -->
        <div class="panel">
            <h2>📞 Редагування контактів</h2>
            <div class="form-group">
                <label>Телефон:</label>
                <input type="text" id="contactPhone" placeholder="+380 XX XXX XX XX">
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="contactEmail" placeholder="email@example.com">
            </div>
            <div class="form-group">
                <label>Адреса:</label>
                <input type="text" id="contactAddress" placeholder="м. Місто, вул. Вулиця, 1">
            </div>
            <button onclick="saveContacts()">💾 Зберегти контакти</button>
            <div id="contactSuccess" class="success-msg hidden">✅ Контакти збережено!</div>
        </div>

        <!-- Управління меню -->
        <div class="panel">
            <h2>🍽️ Управління меню</h2>
            <div class="form-group">
                <label>Назва страви:</label>
                <input type="text" id="itemName" placeholder="Наприклад: Шаурма Класична">
            </div>
            <div class="form-group">
                <label>Опис:</label>
                <textarea id="itemDesc" placeholder="Опис страви..."></textarea>
            </div>
            <div class="form-group">
                <label>Ціна (грн):</label>
                <input type="number" id="itemPrice" placeholder="120">
            </div>
            <button onclick="addMenuItem()">➕ Додати страву</button>
            <div id="menuSuccess" class="success-msg hidden">✅ Страву додано!</div>

            <h3 style="margin-top: 30px; color: #764ba2;">Поточне меню:</h3>
            <div id="menuGrid" class="menu-grid"></div>
        </div>

        <!-- Зміна пароля -->
        <div class="panel">
            <h2>🔒 Зміна пароля</h2>
            <div class="form-group">
                <label>Новий пароль:</label>
                <input type="password" id="newPassword" placeholder="Новий пароль">
            </div>
            <button onclick="changePassword()">Змінити пароль</button>
            <div id="passwordSuccess" class="success-msg hidden">✅ Пароль змінено!</div>
        </div>
    </div>

    <script>
        const DEFAULT_PASSWORD = 'admin123';

        // Перевірка пароля
        function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            const savedPassword = localStorage.getItem('adminPassword') || DEFAULT_PASSWORD;

            if (input === savedPassword) {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadData();
            } else {
                alert('Невірний пароль! 🚫');
                document.getElementById('passwordInput').value = '';
            }
        }

        // Вихід
        function logout() {
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('passwordInput').value = '';
        }

        // Завантаження даних
        function loadData() {
            loadContacts();
            renderMenu();
        }

        // Завантаження контактів
        function loadContacts() {
            const contacts = localStorage.getItem('shawarmaContacts');
            if (contacts) {
                const data = JSON.parse(contacts);
                document.getElementById('contactPhone').value = data.phone || '';
                document.getElementById('contactEmail').value = data.email || '';
                document.getElementById('contactAddress').value = data.address || '';
            }
        }

        // Збереження контактів
        function saveContacts() {
            const contacts = {
                phone: document.getElementById('contactPhone').value,
                email: document.getElementById('contactEmail').value,
                address: document.getElementById('contactAddress').value
            };
            localStorage.setItem('shawarmaContacts', JSON.stringify(contacts));

            const msg = document.getElementById('contactSuccess');
            msg.classList.remove('hidden');
            setTimeout(() => msg.classList.add('hidden'), 3000);
        }

        // Меню
        const defaultMenu = [
            {
                name: "Шаурма Класична",
                desc: "Курячі стегенця-гриль, свіжі овочі, айсберг, фірмовий соус Остапа",
                price: 120
            },
            {
                name: "Шаурма Мега",
                desc: "Подвійна порція м'яса, сир фета, гострий соус, овочі",
                price: 160
            },
            {
                name: "Шаурма Вегі",
                desc: "Фалафель, хумус, свіжі овочі, соус тахіні",
                price: 100
            },
            {
                name: "Шаурма Гостра",
                desc: "Яловичина, гострий перець халапеньо, пекельний соус",
                price: 140
            },
            {
                name: "Картопля Фрі",
                desc: "Хрустка золотиста картопля з фірмовим соусом",
                price: 50
            },
            {
                name: "Напій на вибір",
                desc: "Кола, Фанта, Спрайт, Айран",
                price: 30
            }
        ];

        function renderMenu() {
            const saved = localStorage.getItem('shawarmaMenu');
            const menuItems = saved ? JSON.parse(saved) : defaultMenu;

            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';

            menuItems.forEach((item, index) => {
                const menuItem = document.createElement('div');
                menuItem.className = 'menu-item';
                menuItem.innerHTML = `
                    <h3>${item.name}</h3>
                    <p>${item.desc}</p>
                    <div class="price">${item.price} грн</div>
                    <button class="delete-btn" onclick="deleteMenuItem(${index})">🗑️ Видалити</button>
                `;
                grid.appendChild(menuItem);
            });
        }

        function addMenuItem() {
            const name = document.getElementById('itemName').value;
            const desc = document.getElementById('itemDesc').value;
            const price = document.getElementById('itemPrice').value;

            if (name && desc && price) {
                const saved = localStorage.getItem('shawarmaMenu');
                const menuItems = saved ? JSON.parse(saved) : defaultMenu;

                menuItems.push({ name, desc, price: parseInt(price) });
                localStorage.setItem('shawarmaMenu', JSON.stringify(menuItems));

                renderMenu();

                document.getElementById('itemName').value = '';
                document.getElementById('itemDesc').value = '';
                document.getElementById('itemPrice').value = '';

                const msg = document.getElementById('menuSuccess');
                msg.classList.remove('hidden');
                setTimeout(() => msg.classList.add('hidden'), 3000);
            } else {
                alert('Заповніть всі поля! 😊');
            }
        }

        function deleteMenuItem(index) {
            if (confirm('Точно видалити цю страву?')) {
                const saved = localStorage.getItem('shawarmaMenu');
                const menuItems = saved ? JSON.parse(saved) : defaultMenu;

                menuItems.splice(index, 1);
                localStorage.setItem('shawarmaMenu', JSON.stringify(menuItems));

                renderMenu();
            }
        }

        // Зміна пароля
        function changePassword() {
            const newPass = document.getElementById('newPassword').value;
            if (newPass.length >= 6) {
                localStorage.setItem('adminPassword', newPass);
                document.getElementById('newPassword').value = '';

                const msg = document.getElementById('passwordSuccess');
                msg.classList.remove('hidden');
                setTimeout(() => msg.classList.add('hidden'), 3000);
            } else {
                alert('Пароль повинен містити мінімум 6 символів!');
            }
        }
    </script>
</body>
</html>
